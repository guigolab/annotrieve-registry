name: Track TOGA2 annotations

on:
  schedule:
    # Weekly, Monday 05:00 UTC — light load on the fragile Hiller Lab server
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (scan only, no commit)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: track-toga2-annotations
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scan TOGA2 server for new annotations
        id: scan
        run: |
          EXTRA_ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS+=(--dry-run)
          fi
          python scripts/scan_toga2_annotations.py \
            --tsv TOGA2/annotations.tsv \
            --report-file toga2-scan-report.json \
            "${EXTRA_ARGS[@]}"

      - name: Upload scan report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toga2-scan-report
          path: toga2-scan-report.json
          if-no-files-found: ignore

      - name: Commit and push new annotations
        if: >-
          steps.scan.outputs.added_count != '0' &&
          steps.scan.outputs.added_count != '' &&
          !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TOGA2/annotations.tsv
          git commit -m "Track TOGA2: add ${{ steps.scan.outputs.added_count }} new annotation(s) [automated]" \
            -m "Skipped (already tracked / no accession / verify failed): ${{ steps.scan.outputs.skipped_count }}" \
            -m "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push
